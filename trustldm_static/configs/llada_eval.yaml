model_config:
  model: "llada//llada"
  model_path: "/data1/ybshi/LLaDA-8B-Instruct" # change to your path for llada
  type: CHAT
  conv_template: "llada-instruct"

  gen_function: "file:generate_functions/generate_llada.py:generate"
  remasking: "low_confidence"


  model_loader: HF
  torch_dtype: BFLOAT16

key: null
dry_run: false

hydra:
  job:
    chdir: false
  
  callbacks:
    save_job_info:
      _target_: hydra.experimental.callbacks.PickleJobInfoCallback